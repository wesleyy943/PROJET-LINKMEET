<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - LinkMeet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            position: relative;
        }
        .register-card h2 { color: #333; font-weight: 700; }
        .register-card .subtitle { color: #666; font-size: 0.9rem; }
        .btn-primary {
            background: #667eea;
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
        }
        .btn-back {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: #666;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .btn-back:hover {
            background: #f0f0f0;
            color: #333;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .input-group-text {
            background: #f8f9fa;
            border-right: none;
        }
        .form-control { border-left: none; }
        .form-control:focus { border-left: none; }
        .server-info {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            text-align: center;
            margin-top: 10px;
            color: #666;
            word-break: break-all;
        }
        .server-info .badge {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 5px;
            background: #e9ecef;
            transition: all 0.3s ease;
        }
        .password-strength .bar {
            height: 100%;
            border-radius: 2px;
            transition: all 0.3s ease;
            width: 0%;
        }
        .password-strength .bar.weak { width: 25%; background: #dc3545; }
        .password-strength .bar.medium { width: 50%; background: #ffc107; }
        .password-strength .bar.strong { width: 75%; background: #28a745; }
        .password-strength .bar.very-strong { width: 100%; background: #28a745; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="register-card">
                    <!-- Bouton Retour -->
                    <button class="btn-back" onclick="window.location.href='/'">
                        <i class="fas fa-arrow-left"></i> Retour
                    </button>

                    <div class="text-center mb-4">
                        <i class="fas fa-video text-primary" style="font-size: 3rem;"></i>
                        <h2 class="mt-2">LinkMeet</h2>
                        <p class="text-muted">Créez votre compte gratuitement</p>
                    </div>

                    <form id="registerForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="nom" class="form-label fw-semibold">Nom</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <input type="text" class="form-control" id="nom" 
                                           placeholder="Dupont" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="prenom" class="form-label fw-semibold">Prénom</label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="fas fa-user"></i>
                                    </span>
                                    <input type="text" class="form-control" id="prenom" 
                                           placeholder="Jean" required>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3 mt-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email" 
                                       placeholder="exemple@email.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" 
                                       placeholder="Min 8 caractères" required minlength="8">
                            </div>
                            <div class="password-strength">
                                <div class="bar" id="passwordBar"></div>
                            </div>
                            <small class="text-muted">Le mot de passe doit contenir au moins 8 caractères</small>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirmer le mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-check-circle"></i>
                                </span>
                                <input type="password" class="form-control" id="confirmPassword" 
                                       placeholder="Retapez votre mot de passe" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-user-plus me-2"></i>S'inscrire
                        </button>
                    </form>

                    <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                    <div id="successMessage" class="alert alert-success mt-3 d-none"></div>

                    <div class="server-info">
                        <span class="badge"><i class="fas fa-link me-1"></i> Serveur</span>
                        <span id="apiUrlDisplay">Chargement...</span>
                    </div>

                    <hr class="my-4">

                    <p class="text-center text-muted">
                        Déjà inscrit ? 
                        <a href="/pages/login.html" class="text-primary fw-bold text-decoration-none">
                            Connectez-vous
                        </a>
                    </p>

                    <p class="text-center text-muted small">
                        <a href="/" class="text-decoration-none text-muted">
                            <i class="fas fa-home me-1"></i> Retour à l'accueil
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        const API_URL = window.API_URL || 'http://localhost:3000/api';
        document.getElementById('apiUrlDisplay').textContent = API_URL;

        document.getElementById('password').addEventListener('input', function() {
            const password = this.value;
            const bar = document.getElementById('passwordBar');
            
            if (password.length === 0) {
                bar.className = 'bar';
                return;
            }
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]/)) strength++;
            if (password.match(/[A-Z]/)) strength++;
            if (password.match(/[0-9]/)) strength++;
            if (password.match(/[^a-zA-Z0-9]/)) strength++;
            
            const classes = ['weak', 'weak', 'medium', 'strong', 'very-strong'];
            bar.className = 'bar ' + classes[strength];
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nom = document.getElementById('nom').value;
            const prenom = document.getElementById('prenom').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Les mots de passe ne correspondent pas';
                errorDiv.classList.remove('d-none');
                return;
            }

            if (password.length < 8) {
                errorDiv.textContent = 'Le mot de passe doit contenir au moins 8 caractères';
                errorDiv.classList.remove('d-none');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nom, prenom, email, mot_de_passe: password })
                });

                const data = await response.json();

                if (response.ok) {
                    successDiv.textContent = ' Inscription réussie ! Redirection vers la connexion...';
                    successDiv.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = '/pages/login.html';
                    }, 2000);
                } else {
                    errorDiv.textContent = data.message || 'Erreur lors de l\'inscription';
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                console.error('Erreur:', error);
                errorDiv.textContent = ' Erreur de connexion au serveur';
                errorDiv.classList.remove('d-none');
            }
        });

        const token = localStorage.getItem('token');
        if (token) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.role === 'admin') {
                window.location.href = '/pages/admin.html';
            } else {
                window.location.href = '/pages/dashboard.html';
            }
        }
    </script>
</body>
</html>
