<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - LinkMeet</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            position: relative;
        }
        .login-card h2 { color: #333; font-weight: 700; }
        .login-card .subtitle { color: #666; font-size: 0.9rem; }
        .btn-primary {
            background: #667eea;
            border: none;
            padding: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
        }
        .btn-back {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: #666;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 8px;
        }
        .btn-back:hover {
            background: #f0f0f0;
            color: #333;
        }
        .secure-badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .server-info {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            font-size: 11px;
            font-family: monospace;
            text-align: center;
            margin-top: 10px;
            color: #666;
            word-break: break-all;
        }
        .server-info .badge {
            background: #667eea;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 10px;
        }
        .security-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 10px;
        }
        .security-status.secure { color: #28a745; }
        .security-status.insecure { color: #dc3545; }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .input-group-text {
            background: #f8f9fa;
            border-right: none;
        }
        .form-control { border-left: none; }
        .form-control:focus { border-left: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <!-- Bouton Retour -->
                    <button class="btn-back" onclick="window.location.href='/'">
                        <i class="fas fa-arrow-left"></i> Retour
                    </button>

                    <div class="text-center mb-4">
                        <i class="fas fa-video text-primary" style="font-size: 3rem;"></i>
                        <h2 class="mt-2">LinkMeet</h2>
                        <p class="text-muted">Connectez-vous à votre compte</p>
                        <div id="securityStatus" class="security-status">
                            <i class="fas fa-shield-alt"></i>
                            <span id="securityText">Vérification...</span>
                        </div>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-envelope"></i>
                                </span>
                                <input type="email" class="form-control" id="email" 
                                       placeholder="exemple@email.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" class="form-control" id="password" 
                                       placeholder="Votre mot de passe" required>
                            </div>
                        </div>

                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Se souvenir de moi</label>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>

                    <div id="errorMessage" class="alert alert-danger mt-3 d-none"></div>
                    <div id="successMessage" class="alert alert-success mt-3 d-none"></div>

                    <div class="server-info">
                        <span class="badge"><i class="fas fa-link me-1"></i> Serveur</span>
                        <span id="apiUrlDisplay">Chargement...</span>
                    </div>

                    <hr class="my-4">

                    <p class="text-center text-muted">
                        Pas encore de compte ? 
                        <a href="/pages/register.html" class="text-primary fw-bold text-decoration-none">
                            Inscrivez-vous
                        </a>
                    </p>

                    <p class="text-center text-muted small">
                        <a href="/" class="text-decoration-none text-muted">
                            <i class="fas fa-home me-1"></i> Retour à l'accueil
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        const API_URL = window.API_URL || 'http://localhost:3000/api';
        document.getElementById('apiUrlDisplay').textContent = API_URL;

        const securityStatus = document.getElementById('securityStatus');
        const securityText = document.getElementById('securityText');
        
        if (window.location.protocol === 'https:') {
            securityStatus.className = 'security-status secure';
            securityText.innerHTML = '<i class="fas fa-lock me-1"></i> Connexion sécurisée (HTTPS)';
        } else {
            securityStatus.className = 'security-status insecure';
            securityText.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i> Connexion non sécurisée (HTTP) - Utilisez HTTPS pour la caméra';
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            
            errorDiv.classList.add('d-none');
            successDiv.classList.add('d-none');

            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, mot_de_passe: password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    
                    successDiv.textContent = ' Connexion réussie ! Redirection...';
                    successDiv.classList.remove('d-none');
                    
                    setTimeout(() => {
                        if (data.user.role === 'admin') {
                            window.location.href = '/pages/admin.html';
                        } else {
                            window.location.href = '/pages/dashboard.html';
                        }
                    }, 1500);
                } else {
                    errorDiv.textContent = data.message || 'Email ou mot de passe incorrect';
                    errorDiv.classList.remove('d-none');
                }
            } catch (error) {
                console.error('Erreur:', error);
                errorDiv.innerHTML = `
                    <i class="fas fa-exclamation-circle me-2"></i> Erreur de connexion au serveur<br>
                    <small>Vérifiez que le serveur est accessible sur : ${API_URL}</small>
                `;
                errorDiv.classList.remove('d-none');
            }
        });

        const token = localStorage.getItem('token');
        if (token) {
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (user.role === 'admin') {
                window.location.href = '/pages/admin.html';
            } else {
                window.location.href = '/pages/dashboard.html';
            }
        }
    </script>
</body>
</html>
